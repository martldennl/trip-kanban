<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kanban: preview without Weave</title>
    <style>
      /* Not part of the lens: a stand-in for the Weave app around it, with the lens in a frame of the app's size. */
      html { color-scheme: dark; --around: #0d0e12; --panel: #15161a; --edge: #2a2c33; --fg: #ece9e3; --muted: #8b8780; }
      html.light { color-scheme: light; --around: #dcdad3; --panel: #f6f5f1; --edge: #cfccc4; --fg: #1d1b18; --muted: #6b665e; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--around); color: var(--fg); font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
      #panel { margin: 20px; border: 1px solid var(--edge); border-radius: 14px; overflow: hidden; background: var(--panel); }
      #panel h1 { margin: 0; padding: 14px 18px; font-size: 16px; border-bottom: 1px solid var(--edge); }
      #lens { display: block; border: 0; }
      #note { position: fixed; left: 50%; bottom: 14px; translate: -50% 0; padding: 6px 14px; border-radius: 999px; background: var(--edge); color: var(--fg); opacity: 0; transition: opacity .3s; }
      #note.on { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="panel">
      <h1>p/Holiday 2026, Hainan · To-dos</h1>
      <!-- As Weave shows it: sandboxed, scripts only. -->
      <iframe id="lens" title="Kanban" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>
    </div>
    <div id="note"></div>
    <script type="module" src="weave.js"></script>
  </body>
</html>
